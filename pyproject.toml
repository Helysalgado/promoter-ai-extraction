[project]
name = "promoter-ai-extraction"
version = "0.1.0"
description = "Leakage-safe guided extraction and evaluation of bacterial promoter properties from scientific literature."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "openai>=3.26.1",
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "fastembed>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promoter_ai_extraction"]

[tool.hatch.build.targets.wheel.force-include]
"src/promoter_ai_extraction/ui/index.html" = "promoter_ai_extraction/ui/index.html"
"src/promoter_ai_extraction/ui/app.css" = "promoter_ai_extraction/ui/app.css"
"src/promoter_ai_extraction/ui/app.js" = "promoter_ai_extraction/ui/app.js"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: deselect with -m 'not slow'",
    "integration: touches a real boundary",
]
